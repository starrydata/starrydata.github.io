<h1>OGP / Social share images</h1>
<p>SNS シェア時のサムネイル画像（Open Graph Protocol / Twitter Card）。</p>
<h2>推奨仕様</h2>
<table>
<thead>
<tr>
<th>項目</th>
<th>推奨</th>
</tr>
</thead>
<tbody>
<tr>
<td>サイズ</td>
<td>1200 × 630 px（OGP 標準）</td>
</tr>
<tr>
<td>形式</td>
<td>JPG または PNG</td>
</tr>
<tr>
<td>容量</td>
<td>500 KB 以下</td>
</tr>
</tbody>
</table>
<h2>ファイル</h2>
<ul>
<li><code>default.jpg</code> — サイト全体のデフォルト OGP（Hero のキャプチャ）</li>
<li><code>paper-&lt;slug&gt;.jpg</code> — 個別記事 OGP（オプション）</li>
</ul>
