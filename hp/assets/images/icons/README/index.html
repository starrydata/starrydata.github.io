<h1>Icons</h1>
<p>サイト内のアイコン素材（favicon、UI アイコンなど）。</p>
<h2>ファイル</h2>
<ul>
<li><code>favicon.ico</code> — ブラウザタブ用</li>
<li><code>favicon-32.png</code> — 32×32</li>
<li><code>favicon-180.png</code> — Apple Touch Icon 180×180</li>
<li><code>logo.svg</code> — サイトロゴ（SVG）</li>
<li><code>logo-mark.svg</code> — ロゴマーク（星マーク）のみ</li>
</ul>
<h2>推奨</h2>
<ul>
<li>SVG をベースに、PNG は必要なサイズに書き出す</li>
<li>favicon は <a href="https://realfavicongenerator.net/">realfavicongenerator.net</a> で生成</li>
</ul>
